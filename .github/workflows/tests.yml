name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci_test_password

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: importguard
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: importguard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U importguard -d importguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Get the project code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest --tb=short